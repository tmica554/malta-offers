<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malta Offers & Live Sports</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

  <header class="bg-red-600 text-white p-4 text-center font-bold text-xl shadow-md sticky top-0 z-10">
    🇲🇹 Malta Offers & Sports
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Locality Filter Dropdown -->
    <div id="locality-filter-container" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
      <label class="text-xs font-bold text-gray-500 uppercase">Filter Locality:</label>
      <select id="locality-filter" onchange="applyFilters()" class="bg-gray-50 border text-sm rounded-lg p-2 font-medium">
        <option value="ALL">All Malta</option>
        <option value="St. Julian's">St. Julian's</option>
        <option value="Sliema">Sliema</option>
        <option value="Valletta">Valletta</option>
        <option value="Gzira">Gzira</option>
        <option value="Bugibba">Bugibba</option>
      </select>
    </div>

    <!-- TAB 1: HOME -->
    <div id="tab-home-content" class="space-y-4">
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
          <div id="count-deals" class="text-2xl font-bold text-red-600">0</div>
          <div class="text-xs text-gray-500 font-medium">Active Deals</div>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
          <div id="count-pl" class="text-2xl font-bold text-blue-600">0</div>
          <div class="text-xs text-gray-500 font-medium">PL Venues</div>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
          <div id="count-f1" class="text-2xl font-bold text-emerald-600">0</div>
          <div class="text-xs text-gray-500 font-medium">F1 Venues</div>
        </div>
      </div>
      <div id="home-venue-list" class="space-y-3"></div>
    </div>

    <!-- TAB 2: DRINKS -->
    <div id="tab-drinks-content" class="hidden space-y-3">
      <h2 class="font-bold text-xl">🍻 Happy Hour Deals</h2>
      <div id="drinks-list" class="space-y-3"></div>
    </div>

    <!-- TAB 3: SPORTS -->
    <div id="tab-sports-content" class="hidden space-y-3">
      <h2 class="font-bold text-xl">⚽ Live Sports Broadcasts</h2>
      <div id="sports-list" class="space-y-3"></div>
    </div>

    <!-- TAB 4: CONTACT & DONATE -->
    <div id="tab-contact-content" class="hidden space-y-4">
      
      <!-- Buy Me a Beer Section -->
      <div class="bg-gradient-to-br from-amber-500 to-amber-600 text-white p-5 rounded-xl shadow-sm space-y-2 text-center">
        <h3 class="font-bold text-lg">🍺 Enjoying Malta Offers?</h3>
        <p class="text-xs text-amber-100">Help keep this platform free and up-to-date by buying the developer a beer!</p>
        <a href="https://revolut.me/yourtag" target="_blank" class="inline-block bg-white text-amber-900 font-bold px-4 py-2 rounded-lg text-sm mt-2 shadow hover:bg-amber-50">
          Donate via Revolut / Coffee
        </a>
      </div>

      <!-- Contact Form -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm space-y-3">
        <h3 class="font-bold text-lg">📩 Submit a Venue or Deal</h3>
        <input type="text" placeholder="Your Name / Venue Name" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
        <textarea rows="3" placeholder="Offer details or schedule..." class="w-full p-2.5 border rounded-lg text-sm bg-gray-50"></textarea>
        <button onclick="alert('Message sent!')" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-lg text-sm">
          Submit
        </button>
      </div>

    </div>

  </main>

  <!-- Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 z-20 max-w-md mx-auto">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-red-600 font-semibold text-xs py-1">🏠<span>Home</span></button>
    <button onclick="switchTab('drinks')" id="nav-drinks" class="flex flex-col items-center text-gray-400 font-semibold text-xs py-1">🍺<span>Drinks</span></button>
    <button onclick="switchTab('sports')" id="nav-sports" class="flex flex-col items-center text-gray-400 font-semibold text-xs py-1">⚽<span>Sports</span></button>
    <button onclick="switchTab('contact')" id="nav-contact" class="flex flex-col items-center text-gray-400 font-semibold text-xs py-1">💬<span>Contact</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
